name: Build and deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 22

      # npm ci takes about two minutes, so node_modules is reused until the
      # lockfile or the Node version changes. It's saved right after installing
      # so a failed build doesn't throw the install away.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Save node_modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      # Gatsby reuses processed images and unchanged pages from a previous
      # build when both of these directories are restored. public/img is a raw
      # copy of static/img that every build recreates, so it isn't worth caching.
      - name: Restore Gatsby build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache
            public/*
            !public/img
          key: gatsby-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gatsby-v2-${{ runner.os }}-

      # On a cold cache gatsby-remark-relative-images can process a markdown
      # file before Gatsby has registered its image and fail with a false
      # "No matching file found". A second attempt has the images registered;
      # a real error fails both times.
      - run: npm run build || npm run build

      # Only main saves, so pull requests can't evict its cache from the
      # repository's 10 GB quota.
      - name: Save Gatsby build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache
            public/*
            !public/img
          key: gatsby-v2-${{ runner.os }}-${{ github.run_id }}

      # Pushes to main go live; pull requests get a temporary preview URL.
      # Secrets aren't available to pull requests from forks, so those only build.
      - name: Deploy to Firebase Hosting
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: ${{ github.event_name != 'pull_request' && 'live' || '' }}
          expires: 7d
